worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    log_format combined_custom '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

    server {
        listen ${PORT} default_server;
        server_name _;
        root /app/public;
        index index.php;

        # Debug headers
        add_header X-Debug-Message "Assets should load" always;
        add_header X-Content-Type-Options "nosniff";

        # Handle static files
        location /js/ {
            alias /app/public/js/;
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        location /css/ {
            alias /app/public/css/;
            add_header Content-Type text/css;
            try_files $uri =404;
        }

        location /images/ {
            alias /app/public/images/;
            try_files $uri =404;
        }

        # Main application handling
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP handling
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTPS on;
        }

        error_log  /dev/stderr warn;
        access_log /dev/stdout combined_custom;
    }
}
